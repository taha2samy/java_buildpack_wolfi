version: '3'

env:
  DOCKER_API_VERSION: "1.50"
  PACK_VOLUME_KEY: "taha-fips-cache-key"

includes:
  img: taskfile/image.yml
  builder: taskfile/builder.yml
  app: taskfile/app.yml
  util: taskfile/util.yml
  bp: taskfile/buildpack.yml

vars:
  REGISTRY: ghcr.io/taha2samy
  BUILD_IMAGE: "{{.REGISTRY}}/java-build-base:latest"
  RUN_IMAGE: "{{.REGISTRY}}/java-run-base:latest"
  BUILDER_NAME: "{{.REGISTRY}}/java-fips-builder:latest"
  BUILDER_CONFIG: 2-builder/builder.toml

tasks:
  default:
    cmds:
      - task: all

  all:
    desc: Build everything from scratch
    cmds:
      - task: img:build-img
      - task: img:run-img
      - task: bp:package
      - task: builder:create