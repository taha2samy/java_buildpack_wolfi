description = "Wolfi FIPS Java Builder"

[stack]
  id = "taha/wolfi-build-image"
  build-image = "ghcr.io/taha2samy/java_fck_fips_builder:latest"
  run-image = "ghcr.io/taha2samy/java_fck_fips_running:latest"

[lifecycle]
  version = "0.19.0"

[[targets]]
  os = "linux"
  arch = "amd64"

[[targets]]
  os = "linux"
  arch = "arm64"

[[buildpacks]]
  uri = "docker://ghcr.io/taha2samy/java-fips-meta:1.0.0"

[[order]]
  [[order.group]]
    id = "fckfips/java"
    version = "1.0.0"
