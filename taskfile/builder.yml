version: '3'

tasks:
  create:
    desc: Create and publish the final Cloud Native Builder
    cmds:
      - pack builder create {{.BUILDER_NAME}} --config {{.BUILDER_CONFIG}} --pull-policy if-not-present
      - docker push {{.BUILDER_NAME}}

  inspect:
    desc: Inspect the final builder
    cmds:
      - pack builder inspect {{.BUILDER_NAME}}