version: '3'

vars:
  BUILDER: ghcr.io/taha2samy/java-fips-builder:latest
  MAVEN_APP_IMG: ghcr.io/taha2samy/maven-fips-app:1.0.0
  MAVEN_PATH: 3-sample-app
  GRADLE_APP_IMG: ghcr.io/taha2samy/gradle-fips-app:1.0.0
  GRADLE_PATH: 4-gradle-app
  LIFECYCLE_IMG: buildpacksio/lifecycle:0.17.2

tasks:
  build-maven:
    desc: Build the Maven application
    cmds:
      - pack build {{.MAVEN_APP_IMG}} --path {{.MAVEN_PATH}} --builder {{.BUILDER}} --env BP_JVM_TYPE=JRE

  run-maven:
    desc: Run the Maven application
    cmds:
      - docker run -it --rm -p 8080:8080 -m 512m {{.MAVEN_APP_IMG}}

  build-gradle:
    desc: Build the Gradle application
    cmds:
      - pack build {{.GRADLE_APP_IMG}} --path {{.GRADLE_PATH}} --builder {{.BUILDER}} --env BP_JVM_TYPE=JRE 

  run-gradle:
    desc: Run the Gradle application
    cmds:
      - docker run -it --rm -p 8080:8080 -m 512m {{.GRADLE_APP_IMG}}

  build-all:
    desc: Build both Maven and Gradle apps
    cmds:
      - task: build-maven
      - task: build-gradle

  sbom-maven:
    desc: Download SBOM for Maven app
    cmds:
      - pack sbom download {{.MAVEN_APP_IMG}} --output-dir ./sbom-maven

  sbom-gradle:
    desc: Download SBOM for Gradle app
    cmds:
      - pack sbom download {{.GRADLE_APP_IMG}} --output-dir ./sbom-gradle