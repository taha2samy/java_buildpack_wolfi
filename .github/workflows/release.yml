name: Buildpack Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - uses: imjasonh/setup-crane@v0.4

      - uses: buildpacks/github-actions/setup-pack@v5.12.3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - id: build-base
        uses: docker/build-push-action@v5
        with:
          context: ./build-image
          file: ./build-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/java_fck_fips_builder:latest

      - id: run-base
        uses: docker/build-push-action@v5
        with:
          context: ./run-image
          file: ./run-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/java_fck_fips_running:latest

      - run: |
          pack buildpack package ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/fips-java:1.0.1 \
            --config ./package.toml \
            --target linux/amd64 \
            --target linux/arm64 \
            --publish

      - run: |
          pack builder create ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/java-fips-builder:latest \
            --config ./2-builder/builder.toml \
            --target linux/amd64 \
            --target linux/arm64 \
            --publish

      - id: resolve-digests
        run: |
          echo "bp_digest=$(crane digest ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/fips-java:1.0.1)" >> $GITHUB_OUTPUT
          echo "builder_digest=$(crane digest ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/java-fips-builder:latest)" >> $GITHUB_OUTPUT

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/java_fck_fips_builder
          subject-digest: ${{ steps.build-base.outputs.digest }}
          push-to-registry: true
          show-summary: false

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/java_fck_fips_running
          subject-digest: ${{ steps.run-base.outputs.digest }}
          push-to-registry: true
          show-summary: false

      - name: Attest FIPS Java Buildpack
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/fips-java
          subject-digest: ${{ steps.resolve-digests.outputs.bp_digest }}
          push-to-registry: true
          show-summary: false

      - name: Attest Custom Builder Image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/java-fips-builder
          subject-digest: ${{ steps.resolve-digests.outputs.builder_digest }}
          push-to-registry: true
          show-summary: false

  cleanup-ghcr-images:
    needs: [build-and-publish]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package_name:
          - java_fck_fips_builder
          - java_fck_fips_running
          - fips-java
          - java-fips-builder
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@cd0cdb900b5dbf3a6f2cc869f0dbb0b8211f50c4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ matrix.package_name }}
          older-than: 1 hour
          delete-untagged: true
          keep-n-tagged: 0
