      #       --path ./fips-java-shim \
      #       --format image \
      #       --target linux/amd64 \
      #       --target linux/arm64 \
      #       --publish

      - name: Pre-create Builder Package on GHCR
        run: |
          docker pull busybox:latest
          docker tag busybox:latest ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/java-fips-builder:latest
          docker push ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/java-fips-builder:latest

      - name: Package Composite Meta Buildpack
        run: |
          pack buildpack package ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/java-fips-meta:1.0.0 \
            --config ./wolfi-java-meta/package.toml \
            --target linux/amd64 \
            --target linux/arm64 \
            --publish

      - name: Create Builder
        run: |
          pack builder create ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/java-fips-builder:latest \
            --config ./2-builder/builder.toml \
            --publish \
            --verbose


